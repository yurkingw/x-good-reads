name: ingest

on:
  workflow_dispatch:
    inputs:
      tweet_url:
        description: "原帖 URL（https://x.com/<handle>/status/<id>）。与 status_id 至少填一个。"
        required: false
        default: ""
        type: string
      status_id:
        description: "纯数字状态 ID。与 tweet_url 同时填写时必须一致。"
        required: false
        default: ""
        type: string
      title:
        description: "可选标题"
        required: false
        default: ""
        type: string
      author_name:
        description: "作者显示名"
        required: false
        default: ""
        type: string
      author_handle:
        description: "作者账号，不带 @"
        required: false
        default: ""
        type: string
      created_at:
        description: "发布时间，ISO 8601，例如 2026-11-03T07:01:29.000Z"
        required: false
        default: ""
        type: string
      full_text:
        description: "原文全文。不填时会尽力抓取；抓取失败则本工作流失败且不写文件。"
        required: false
        default: ""
        type: string
      summary_zh:
        description: "中文 AI 摘要。强烈建议由调用方传入。"
        required: false
        default: ""
        type: string

# contents: write 用来把 content/x/<id>.json 推到 main。
# actions: write 用来在推送之后 dispatch pages.yml。
# 默认 GITHUB_TOKEN 的 push 不会再次触发 on.push，所以这里必须显式启动 pages。
permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Only publish from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "ingest 只能在 main 上运行。请用 ref=main 调用。"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write content file
        id: ingest
        env:
          TWEET_URL: ${{ inputs.tweet_url }}
          STATUS_ID: ${{ inputs.status_id }}
          TITLE: ${{ inputs.title }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_HANDLE: ${{ inputs.author_handle }}
          CREATED_AT: ${{ inputs.created_at }}
          FULL_TEXT: ${{ inputs.full_text }}
          SUMMARY_ZH: ${{ inputs.summary_zh }}
        run: node scripts/ingest.js

      - run: npm test

      - name: Commit archive
        id: commit
        run: |
          git add content/x
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "内容没有变化。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "archive: ${{ steps.ingest.outputs.status_id }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
