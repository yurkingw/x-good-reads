name: ingest

on:
  workflow_dispatch:
    inputs:
      tweet_url:
        description: "Original post URL (https://x.com/<handle>/status/<id>). Provide this or status_id."
        required: false
        default: ""
        type: string
      status_id:
        description: "Numeric status id only. Must match tweet_url when both are set."
        required: false
        default: ""
        type: string
      title:
        description: "Optional title"
        required: false
        default: ""
        type: string
      author_name:
        description: "Author display name"
        required: false
        default: ""
        type: string
      author_handle:
        description: "Author handle, without @"
        required: false
        default: ""
        type: string
      created_at:
        description: "Publish time, ISO 8601, for example 2026-11-03T07:01:29.000Z"
        required: false
        default: ""
        type: string
      full_text:
        description: "Original post text, in its original language. If omitted, the workflow tries to fetch it and fails without writing a file when that fetch fails."
        required: false
        default: ""
        type: string
      summary:
        description: "English AI summary alias. Used only when summary_en is empty. Same hard max: 250 words."
        required: false
        default: ""
        type: string
      summary_en:
        description: "English AI summary. Optional. Target 120-180 words, hard max 250 words. Over the limit fails before a content file is written. This action does not call a summary API."
        required: false
        default: ""
        type: string
      summary_zh:
        description: "Chinese AI summary. Optional. Target 220-350 characters, hard max 500 characters after removing whitespace. Over the limit fails before a content file is written."
        required: false
        default: ""
        type: string

# contents: write — push content/x/<id>.json and media/x/<id>/ to main.
# actions: write — dispatch pages.yml after that push.
# A push from the default GITHUB_TOKEN does not trigger on.push again, so pages must be started here.
permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Only publish from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "ingest can only run on main. Dispatch it with ref=main."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate summaries and write content file
        id: ingest
        env:
          TWEET_URL: ${{ inputs.tweet_url }}
          STATUS_ID: ${{ inputs.status_id }}
          TITLE: ${{ inputs.title }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_HANDLE: ${{ inputs.author_handle }}
          CREATED_AT: ${{ inputs.created_at }}
          FULL_TEXT: ${{ inputs.full_text }}
          SUMMARY: ${{ inputs.summary }}
          SUMMARY_EN: ${{ inputs.summary_en }}
          SUMMARY_ZH: ${{ inputs.summary_zh }}
        run: node scripts/ingest.js

      - run: npm test

      - name: Commit archive
        id: commit
        run: |
          git add content/x media/x
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "archive: ${{ steps.ingest.outputs.status_id }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
